name: m1

on: [push, pull_request]

env:
  BOINC_DIR: ./boinc

jobs:
  build:
    runs-on: macos-26-intel

    name: >-
      macOS 15

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Print gcc version
        run: |
          uname -a
          CURL_SSL_BACKEND=secure-transport curl -v https://asteroidsathome.net/boinc/notices.php --http1.1
