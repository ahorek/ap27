name: m1

on: [push, pull_request]

env:
  BOINC_DIR: ./boinc

jobs:
  build:
    runs-on: macos-26

    name: >-
      macOS 15

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Print gcc version
        run: |
          uname -a
          security find-certificate -a -Z /System/Library/Keychains/SystemRootCertificates.keychain | grep -i "HARICA"
